<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatDelay {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes signalMove {
        0% { cx: 120px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 1080px; opacity: 0; }
      }
      .pulse-ambient-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 250px 120px;
      }
      .pulse-ambient-2 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 950px 280px;
      }
      .flow-stream {
        stroke-dasharray: 10, 10;
        animation: flowDash 12s linear infinite;
      }
      .float-badge-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-badge-2 {
        animation: floatDelay 6s ease-in-out infinite;
      }
      .signal-dot {
        animation: signalMove 8s ease-in-out infinite;
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .banner-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.03em;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)"/>

  <!-- Ambient Pulsing Glow Orbs (Dynamic Background) -->
  <g opacity="0.6">
    <circle class="pulse-ambient-1" cx="240" cy="120" r="160" fill="#0284c7" filter="url(#glowPulse)" />
    <circle class="pulse-ambient-2" cx="960" cy="280" r="180" fill="#7c3aed" filter="url(#glowPulse)" />
    <circle cx="600" cy="210" r="120" fill="#0f766e" opacity="0.25" filter="url(#glowPulse)" />
  </g>

  <!-- Geometric & Circuit Flow Tracks -->
  <g opacity="0.45">
    <path class="flow-stream" d="M 60 80 Q 300 20 600 80 T 1140 80" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-stream" d="M 60 350 Q 300 410 600 350 T 1140 350" fill="none" stroke="#a855f7" stroke-width="2"/>
    <!-- Connecting Verification Track -->
    <path d="M 120 210 L 1080 210" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4, 4"/>
  </g>

  <!-- Dynamic Signal Dot Traversing the Verification Track -->
  <circle class="signal-dot" cy="210" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>

  <!-- Dynamic Pill Badges - Top & Bottom Orbiting Cards (Non-Obtrusive to Title) -->
  <g class="float-badge-1" transform="translate(100, 36)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="34" y="22" fill="#e0f2fe" class="badge-text">⚡ AI Invoice Extraction</text>
  </g>

  <g class="float-badge-2" transform="translate(890, 36)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="34" y="22" fill="#d1fae5" class="badge-text">✔ EDI 210 Reconciled</text>
  </g>

  <g class="float-badge-2" transform="translate(100, 350)">
    <rect width="230" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95"/>
    <circle cx="20" cy="17" r="5" fill="#c084fc"/>
    <text x="34" y="22" fill="#ede9fe" class="badge-text">🛡️ Rate Compliance 99.8%</text>
  </g>

  <g class="float-badge-1" transform="translate(870, 350)">
    <rect width="230" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" opacity="0.95"/>
    <circle cx="20" cy="17" r="5" fill="#22d3ee"/>
    <text x="34" y="22" fill="#cffafe" class="badge-text">📊 Zero Overcharge Leakage</text>
  </g>

  <!-- Foreground Main Title & Content (Strictly in foreground, elevated contrast) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="450" y="88" width="300" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="600" y="106" fill="#94a3b8" class="banner-sub" font-size="11">AWESOME CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="170" fill="url(#primaryTextGrad)" class="banner-title" font-size="44" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      AUTOMATED FREIGHT &amp; LOGISTICS
    </text>

    <!-- Subtitle -->
    <text x="600" y="220" fill="#ffffff" class="banner-sub" font-size="24" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.7))">
      BILLING AUDITS &amp; SPEND RECONCILIATION
    </text>

    <!-- Tagline & Description -->
    <text x="600" y="265" fill="#94a3b8" class="banner-desc" font-size="16">
      Carrier Invoice Validation • Contracted Rate Compliance • EDI 210/204 • Payment Automation
    </text>

    <!-- Feature Icons Bar -->
    <g transform="translate(390, 292)">
      <rect x="0" y="0" width="420" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="0.8" opacity="0.9"/>
      <text x="210" y="21" fill="#cbd5e1" class="badge-text" font-size="12" letter-spacing="0.04em">
        🚀 Enterprise SaaS  |  Deterministic Core  |  Open-Source TMS
      </text>
    </g>
  </g>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
